name: ${COMPOSE_PROJECT_NAME:-klipforge}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-klipforge}
      POSTGRES_USER: ${POSTGRES_USER:-klipforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-klipforge_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-klipforge}:${POSTGRES_PASSWORD:-klipforge_dev_password}@postgres:5432/${POSTGRES_DB:-klipforge}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-replace-with-random-64-characters}
      JWT_ISSUER: ${JWT_ISSUER:-klipforge-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-klipforge-web}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER:-local-development-refresh-pepper-replace-with-random-64-chars}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-klipforge_refresh_token}
      REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-10}
      AUTH_REGISTER_RATE_LIMIT: ${AUTH_REGISTER_RATE_LIMIT:-5}
      AUTH_REFRESH_RATE_LIMIT: ${AUTH_REFRESH_RATE_LIMIT:-30}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1m}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-klipforge}:${POSTGRES_PASSWORD:-klipforge_dev_password}@postgres:5432/${POSTGRES_DB:-klipforge}?sslmode=disable
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/usr/local/bin/klipforge-migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-klipforge}:${POSTGRES_PASSWORD:-klipforge_dev_password}@postgres:5432/${POSTGRES_DB:-klipforge}?sslmode=disable
    entrypoint: ["/usr/local/bin/klipforge-seed"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      API_INTERNAL_URL: http://api:8080
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
