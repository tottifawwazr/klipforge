name: Full-stack checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: klipforge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: klipforge_ci
          POSTGRES_USER: klipforge
          POSTGRES_PASSWORD: ci_only_database_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U klipforge -d klipforge_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://klipforge:ci_only_database_password@127.0.0.1:5432/klipforge_ci?sslmode=disable
      TEST_DATABASE_URL: postgres://klipforge:ci_only_database_password@127.0.0.1:5432/klipforge_ci?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/12
      MIGRATIONS_DIR: ${{ github.workspace }}/migrations
      HTTP_HOST: 127.0.0.1
      PORT: "8082"
      API_INTERNAL_URL: http://127.0.0.1:8082
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3002
      JWT_SECRET: ci-only-jwt-secret-for-ephemeral-tests-never-use-in-production
      REFRESH_TOKEN_PEPPER: ci-only-refresh-pepper-for-ephemeral-tests-never-use-in-production
      METRICS_PROVIDER: mock
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_START_WEB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci
      - name: Initialize isolated CI database
        working-directory: services/api
        run: |
          go run ./cmd/migrate up
          go run ./cmd/seed
      - name: Backend quality and integration tests
        working-directory: services/api
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go test -race -p 1 -count=1 ./...
      - name: Frontend quality and unit tests
        working-directory: apps/web
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Start API for browser workflow
        run: |
          mkdir -p .cache/bin
          go -C services/api build -o ../../.cache/bin/api ./cmd/api
          ./.cache/bin/api > .cache/api-ci.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8082/api/v1/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Verify complete browser workflow
        working-directory: apps/web
        run: npm run test:e2e
